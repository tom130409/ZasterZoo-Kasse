 hätten.","Das liegt nicht daran, dass du zu ungeduldig bist. Manche Menschen mussten früh lernen: Wer zögert, verliert. Wer dagegen in geordneten, sicheren Verhältnissen groß wurde, hat gelernt, dass Regeln und Geduld eher zum Ziel führen. Beide Denkweisen sind dabei nicht falsch, sie haben nur unterschiedliche Probleme gelöst.","Das Spiel beschreibt so ein Modell: sechs bis acht solcher Denkweisen, jede mit eigener innerer Logik. Deine – direkt, entschlossen, ergebnisorientiert – ist eine davon, nicht die einzig richtige, aber auch keine, für die du dich rechtfertigen musst.","Nebenbei lernst du dabei, wie unser Geldsystem tatsächlich funktioniert – wer die Regeln kennt, nach denen wirklich gespielt wird, hat einen echten Vorteil gegenüber allen, die sie nicht kennen.","Sei ein Hai. Kostet nichts, auch mal zu schauen, was sich unter der Oberfläche noch bewegt."]},
